<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewsport" content="width=device-width, intial-scale=1.0">
        <title>forms</title>
    </head>
    <body>
        <h1>Pete's Pizza Delivery</h1>
        <h2>Online Order Form</h2>
        <strong>*required fields</strong>
    </body>
    <div>
        <form action="" target="_blank" >
            <br>
            <fieldset>
                <legend>Customer details</legend>
                <label for="name">*Name:</label>
                <input type="text" id="name" required>
                <br><br>
                 <label for="address">*Address:</label>
                <input type="address" id="address" required>
                <br><br> 
                <label for="city">*Town/city:</label>
                <input type="city" id="city" required>
                <br><br>
                 <label for="postcode">*Postcode:</label>
                <input type="code" id="postcode" required>
                <br><br>
                 <label for="phone number">*Tel:</label>
                <input type="tel" id="Phone number" required>
                <br><br>
                 <label for="email">*Email:</label>
                <input type="email" id="email" required>

            </fieldset>
            <br><br>
            <fieldset>
                <legend>Topping*</legend>
                </fieldset>
                <fieldset>
                    <legend>Size*</legend>
                </fieldset>
                <fieldset><legend>Extras*</legend>
                </fieldset>
                <br><br>
            <fieldset>
              <legend>Delivery</legend>
              <label for="delivery">Preferred delivery time:</label>
              <input type="time" id="delivery" placeholder="--:--" required>
              <br><br>
              <label for="instruction">Delivery instructions:</label>
              <br>
              <textarea name="instuction" id="instruction" rows="4" cols="210"></textarea>
            </fieldset>
            <br><br>
            <button type="submit">Submit order</button>
            
        </form>
    </div>
</html>
